name: Deploy game00 to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust y el target wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Instalar wasm-bindgen-cli explícito
        run: cargo install wasm-bindgen-cli --version 0.2.92

      - name: Compilar crate a WebAssembly con Cargo
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Generar bindings con wasm-bindgen
        run: |
          mkdir -p dist
          wasm-bindgen --target web --out-dir dist target/wasm32-unknown-unknown/release/game00.wasm
          cp static/index.html dist/ 2>/dev/null || true
          cp static/*.js dist/ 2>/dev/null || true
          cp static/*.json dist/ 2>/dev/null || true

      - name: Desplegar a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist