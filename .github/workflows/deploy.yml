name: Deploy game00 to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust y el target wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Instalar wasm-bindgen-cli explícito
        run: cargo install wasm-bindgen-cli --version 0.2.92

      - name: Compilar crate a WebAssembly con Cargo
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Generar bindings para Macroquad (no-modules)
        run: |
          mkdir -p dist
          # Copiar primero los archivos estáticos (index.html, mq_js_bundle.js, etc.)
          cp -r static/* dist/ 2>/dev/null || cp -r * dist/ 2>/dev/null || true
          
          # Generar con --target no-modules para que los scripts globales de Macroquad reconozcan los bindings
          wasm-bindgen --target no-modules --out-dir dist --out-name game00 target/wasm32-unknown-unknown/release/game00.wasm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar a GitHub Pages nativo
        id: deployment
        uses: actions/deploy-pages@v4