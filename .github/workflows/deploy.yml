name: Deploy game00 to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust y el target wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Validar pruebas y lint
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Compilar crate a WebAssembly con Cargo
        run: cargo build --locked --release --target wasm32-unknown-unknown --bin game00

      - name: Preparar sitio para el cargador de Macroquad
        run: |
          mkdir -p dist
          cp -r static/. dist/
          cp target/wasm32-unknown-unknown/release/game00.wasm dist/game00.wasm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar a GitHub Pages nativo
        id: deployment
        uses: actions/deploy-pages@v4